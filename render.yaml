services:
  - type: web
    name: kehidbot
    runtime: python
    repo: https://github.com/YOUR_USERNAME/kehidbot  # replace with your repo URL
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: AI_API_URL
        sync: false
      - key: AI_API_KEY
        sync: false
