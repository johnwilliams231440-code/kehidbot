version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  bot:
    build: .
    container_name: kehidbot
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - OLLAMA_HOST=http://ollama:11434
      - AI_MODEL=llama3.2:3b
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_data:
